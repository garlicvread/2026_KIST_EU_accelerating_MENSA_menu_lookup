# 이 파일은 메뉴 갱신 설정을 직접 지정하는 예시입니다. 설정과 작업 시작을 구분하기 위해, 파일을 읽는 동작만으로는 메뉴 갱신 작업을 활성화하지 않습니다.
# 메뉴 갱신 코드는 지정한 디렉터리 또는 GitHub에 메뉴 데이터를 게시합니다. HTML과 정적 리소스는 별도로 게시하므로 이 설정으로 갱신되지 않습니다.
# 설정 읽기 코드는 이 파일의 디렉터리를 기준으로 경로를 해석합니다. 아래 예시는 세 작업 디렉터리가 서로 겹치지 않도록 같은 상위 디렉터리 아래에 둡니다.
# 실제 배포 위치를 사용하도록 운영자는 아래 예시 경로를 사용할 디렉터리로 바꾸어 주세요.
[paths]
checkout_dir = "../worker-checkout"
state_dir = "../worker-private"
# public_dir는 웹사이트 루트입니다. 같은 게시본의 메뉴와 번역을 읽도록 웹사이트는 data/current.json에서 지정한 data/releases/<ID>/menu.json과 translations.json을 선택합니다.
public_dir = "../worker-public"

[inference]
mode = "managed"
provider = "ollama"
# 설정이 실제로 준비된 모델을 가리키도록 운영자는 아래 두 식별자 예시를 설치한 모델과 해당 리비전으로 바꾸어 주세요.
# 설정 예시를 준비 완료의 증거로 해석하지 않도록 안내드립니다. 이 파일은 모델, 가중치, 실행 파일 또는 요청 주소의 사용 가능 여부를 검증하지 않습니다.
model = "replace-with-provisioned-model"
revision = "replace-with-provisioned-revision"
binary = "../worker-private/runtime/bin/ollama"
models_dir = "../worker-private/runtime/models"
log_dir = "../worker-private/runtime/logs"

[resources]
# 운영자는 아래 Linux 설정과 자원 기준값을 예시로 사용해 주세요. 이 파일은 실제 실행할 호스트가 해당 조건을 만족하는지 검증하지 않습니다.
# 실제 실행 환경에 맞추도록 운영자는 사용할 플랫폼(linux 또는 macos)과 자원 사용 기준을 직접 지정해 주세요.
platform = "linux"
min_available_bytes = 8589934592
max_load_per_cpu = 0.75

[publication]
mode = "directory"

# GitHub에 메뉴 데이터를 게시하려면 운영자는 위 publication 설정 표를 다음 예시로 바꾸어 주세요.
# [publication]
# mode = "github"
# repository = "example-owner/menu-site"
# workflow = "update-and-deploy.yml"
# remote = "https://example.invalid/example-owner/menu-site.git"
# 설정 읽기 코드는 repository와 remote를 각각 지정된 값으로 취급하며 연결 가능 여부를 확인하지 않습니다. 운영자는 두 값이 의도한 저장소를 가리키도록 각각 지정해 주세요.
