name: Validated menu and Pages
run-name: Publish menu ${{ inputs.snapshot_sha }}

on:
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Validated main-branch commit to publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: mensa-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Verify requested snapshot belongs to main
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$SNAPSHOT_SHA" origin/main
          git checkout --detach "$SNAPSHOT_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_ui.mjs
      - name: Validate the locally prepared snapshot
        run: |
          python -m scripts.update_menu --validate-only
          python -c "from pathlib import Path; from scripts.update_menu import read_json, require_current_coverage; require_current_coverage(read_json(Path('site/data/menu.json')))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Explain rejected deployment
        if: failure()
        run: |
          echo 'Deployment failed. The previous public Pages deployment remains unchanged. The local queue retains the request for inspection/retry.' >> "$GITHUB_STEP_SUMMARY"
