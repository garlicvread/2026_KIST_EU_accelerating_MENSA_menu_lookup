name: Deploy Pages code

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mensa-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked frontend compiler
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Regression tests
        run: |
          python -m unittest discover -s tests -v
          npm test
      - name: Validate deterministic menu fixtures
        run: python -m scripts.update_menu --validate-only --data-dir tests/fixtures/menu-data
      - name: Build versioned Pages UI assets
        env:
          MENSA_DRIVE_FILE_ID: ${{ vars.MENSA_DRIVE_FILE_ID }}
        run: python -m scripts.build_site --drive-file-id "$MENSA_DRIVE_FILE_ID"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .tmp/pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Explain rejected deployment
        if: failure()
        run: |
          echo 'Code deployment failed. Check the tests and MENSA_DRIVE_FILE_ID repository variable, then retry this workflow. Runtime menu updates are published directly to Drive.' >> "$GITHUB_STEP_SUMMARY"
